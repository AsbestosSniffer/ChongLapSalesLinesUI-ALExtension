# Custom workflow (not part of AL-Go for GitHub, so Update AL-Go System Files leaves it alone).
# Builds ONLY the apps chosen in the run and creates a GitHub release for exactly those apps, in one run.
# The build reuses AL-Go's own _BuildALGoProject.yaml, called the same way CI/CD calls it. The release contains
# the compiled .app files of the chosen apps, not the other apps in the repository.
#
# Apps are chosen with the checkboxes (or with folder names in otherApps). Tick none and leave otherApps empty to
# build and release every app. When you add an app to the repository, add a checkbox for it here, named
# app_<folder name>, and do the same in the other two selection workflows.
#
# When AL-Go is updated, compare the Initialization and Build jobs below with the new CICD.yaml and bring over any
# changes to the AL-Go action versions and to the inputs of _BuildALGoProject.yaml.
name: ' Build And Create Release'
run-name: "Build and create release ${{ inputs.tag }}"

concurrency:
  group: ${{ github.workflow }}

on:
  workflow_dispatch:
    inputs:
      # One checkbox per app folder. Tick none (and leave otherApps empty) to build and release every app.
      app_app1:
        description: 'app1 (SalesLinesUIExtension)'
        type: boolean
        default: false
      app_FEFOLotAssignment:
        description: 'FEFOLotAssignment'
        type: boolean
        default: false
      app_HAOrderFromEmail:
        description: 'HAOrderFromEmail'
        type: boolean
        default: false
      app_LowAmountOrderNotification:
        description: 'LowAmountOrderNotification'
        type: boolean
        default: false
      app_MixAndMatch:
        description: 'MixAndMatch'
        type: boolean
        default: false
      app_PoisonFormCheckBox:
        description: 'PoisonFormCheckBox'
        type: boolean
        default: false
      app_ReportBuilding:
        description: 'ReportBuilding'
        type: boolean
        default: false
      app_ShopifyUOMCorrection:
        description: 'ShopifyUOMCorrection'
        type: boolean
        default: false
      otherApps:
        description: 'Any app not listed above: folder names, comma-separated (* or empty = every app)'
        type: string
        required: false
        default: ''
      name:
        description: Name of the release (defaults to the tag)
        required: false
        default: ''
      tag:
        description: Tag of the release (semantic version, e.g. 1.0.0)
        required: true
      releaseType:
        description: Release, prerelease or draft?
        type: choice
        default: Release
        options:
          - Release
          - Prerelease
          - Draft

permissions:
  actions: read
  contents: write
  id-token: write
  packages: read

defaults:
  run:
    shell: powershell

env:
  workflowDepth: 1
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  Initialization:
    needs: [ ]
    runs-on: [ windows-latest ]
    outputs:
      telemetryScopeJson: ${{ steps.init.outputs.telemetryScopeJson }}
      buildOrderJson: ${{ steps.SelectProjects.outputs.BuildOrderJson }}
      selectedAppsJson: ${{ steps.SelectProjects.outputs.SelectedAppsJson }}
      projectDependenciesJson: ${{ steps.determineProjectsToBuild.outputs.ProjectDependenciesJson }}
      baselineWorkflowRunId: ${{ steps.determineProjectsToBuild.outputs.BaselineWorkflowRunId }}
      baselineWorkflowSHA: ${{ steps.determineProjectsToBuild.outputs.BaselineWorkflowSHA }}
    steps:
      - name: Dump Workflow Information
        uses: microsoft/AL-Go-Actions/DumpWorkflowInfo@v9.2
        with:
          shell: powershell

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Initialize the workflow
        id: init
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v9.2
        with:
          shell: powershell

      - name: Read settings
        id: ReadSettings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.2
        with:
          shell: powershell
          get: type

      # Checked here so a mistyped app name fails in seconds instead of after the build.
      - name: Validate selected apps
        env:
          SelectedApps: ${{ github.event.inputs.otherApps }}
          InputsJson: ${{ toJson(github.event.inputs) }}
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE '.github/SelectAppsForDeployment.ps1') -ValidateOnly

      - name: Determine Workflow Depth
        id: DetermineWorkflowDepth
        run: |
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "WorkflowDepth=$($env:workflowDepth)"

      - name: Determine Projects To Build
        id: determineProjectsToBuild
        uses: microsoft/AL-Go-Actions/DetermineProjectsToBuild@v9.2
        with:
          shell: powershell
          maxBuildDepth: ${{ env.workflowDepth }}

      # Keeps only the chosen apps (plus anything they depend on inside this repository) in AL-Go's build matrix.
      # The inputs are passed through env, not pasted into the script, so text typed into the run form can't change the script.
      - name: Select projects to build
        id: SelectProjects
        env:
          InputsJson: ${{ toJson(github.event.inputs) }}
          BuildOrderJson: ${{ steps.determineProjectsToBuild.outputs.BuildOrderJson }}
          ProjectDependenciesJson: ${{ steps.determineProjectsToBuild.outputs.ProjectDependenciesJson }}
        run: |
          $ErrorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0

          # Read the chosen apps: every app_<folder> checkbox that is ticked, plus anything typed in otherApps.
          $inputs = $env:InputsJson | ConvertFrom-Json
          $tokens = @()
          foreach ($property in $inputs.PSObject.Properties) {
              if ($property.Name -like 'app_*' -and "$($property.Value)" -eq 'true') {
                  $tokens += $property.Name.Substring(4)
              }
          }
          foreach ($token in @($inputs.otherApps -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })) {
              $tokens += $token
          }
          $tokens = @($tokens | Select-Object -Unique)

          # All apps in the repository, found by app.json, like .github/SelectAppsForDeployment.ps1 does.
          $repoApps = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Directory | ForEach-Object {
                  $appJsonPath = Join-Path $_.FullName 'app.json'
                  if (Test-Path $appJsonPath -PathType Leaf) {
                      $appJson = Get-Content -Path $appJsonPath -Raw -Encoding UTF8 | ConvertFrom-Json
                      [PSCustomObject]@{ Folder = $_.Name; Name = [string] $appJson.name; Id = ([string] $appJson.id).ToLowerInvariant() }
                  }
              })

          # No checkboxes ticked and nothing typed means every app. '*' also means every app.
          $allApps = ($tokens.Count -eq 0) -or ($tokens -contains '*')
          $selectedApps = @()
          if (-not $allApps) {
              foreach ($token in $tokens) {
                  $match = @($repoApps | Where-Object { $_.Folder -eq $token -or $_.Name -eq $token })
                  if ($match.Count -eq 0) {
                      $valid = ($repoApps | ForEach-Object { $_.Folder } | Sort-Object) -join ', '
                      throw "'$token' is not an app in this repository. Use folder names, comma-separated: $valid"
                  }
                  $selectedApps += $match[0]
              }
              $selectedApps = @($selectedApps | Sort-Object Folder -Unique)
          }
          else {
              $selectedApps = @($repoApps)
          }

          # Apps that the chosen apps depend on inside this repository must also be built (but are not released).
          $projectDependencies = $env:ProjectDependenciesJson | ConvertFrom-Json
          $dependencyNames = @($projectDependencies | Get-Member -MemberType NoteProperty | ForEach-Object { $_.Name })
          $buildFolders = @($selectedApps | ForEach-Object { $_.Folder })
          $changed = $true
          while ($changed) {
              $changed = $false
              foreach ($folder in @($buildFolders)) {
                  if ($dependencyNames -contains $folder) {
                      foreach ($dependency in @($projectDependencies."$folder")) {
                          if ($buildFolders -notcontains $dependency) {
                              $buildFolders += [string] $dependency
                              $changed = $true
                          }
                      }
                  }
              }
          }

          # Keep only the build dimensions for those folders in AL-Go's build matrix.
          $buildOrder = $env:BuildOrderJson | ConvertFrom-Json
          if (@($buildOrder).Count -eq 0) {
              throw "AL-Go found no projects to build in this repository."
          }
          $kept = @($buildOrder[0].buildDimensions | Where-Object { $buildFolders -contains $_.project })
          $keptProjects = @($kept | ForEach-Object { $_.project })
          $missing = @($buildFolders | Where-Object { $_ -notin $keptProjects })
          if ($missing.Count -gt 0) {
              throw "These apps are not part of the build AL-Go determined for this run: $($missing -join ', '). Run the CI/CD workflow once and try again."
          }

          $filteredBuildOrder = @(@{ projectsCount = $kept.Count; buildDimensions = @($kept) })
          $filteredBuildOrderJson = ConvertTo-Json -InputObject $filteredBuildOrder -Depth 20 -Compress
          $selectedAppsJson = ConvertTo-Json -InputObject @($selectedApps | ForEach-Object { $_.Folder }) -Compress

          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "BuildOrderJson=$filteredBuildOrderJson"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "SelectedAppsJson=$selectedAppsJson"
          Write-Host "Apps to release: $((@($selectedApps | ForEach-Object { $_.Name })) -join ', ')"
          Write-Host "Projects to build: $($buildFolders -join ', ')"

  Build:
    needs: [ Initialization ]
    if: (!failure()) && (!cancelled()) && fromJson(needs.Initialization.outputs.buildOrderJson)[0].projectsCount > 0
    strategy:
      matrix:
        include: ${{ fromJson(needs.Initialization.outputs.buildOrderJson)[0].buildDimensions }}
      fail-fast: false
    name: Build ${{ matrix.projectName }} (${{ matrix.buildMode }})
    uses: ./.github/workflows/_BuildALGoProject.yaml
    secrets: inherit
    with:
      shell: ${{ matrix.githubRunnerShell }}
      runsOn: ${{ matrix.githubRunner }}
      project: ${{ matrix.project }}
      projectName: ${{ matrix.projectName }}
      buildMode: ${{ matrix.buildMode }}
      # The selected apps are always built from source in this run - a release must never reuse cached artifacts.
      skippedProjectsJson: '[]'
      projectDependenciesJson: ${{ needs.Initialization.outputs.projectDependenciesJson }}
      baselineWorkflowRunId: ${{ needs.Initialization.outputs.baselineWorkflowRunId }}
      baselineWorkflowSHA: ${{ needs.Initialization.outputs.baselineWorkflowSHA }}
      secrets: 'licenseFileUrl,codeSignCertificateUrl,*codeSignCertificatePassword,keyVaultCertificateUrl,*keyVaultCertificatePassword,keyVaultClientId,gitHubPackagesContext,applicationInsightsConnectionString'
      signArtifacts: true
      useArtifactCache: true
      needsContext: ${{ toJson(needs) }}

  CreateRelease:
    needs: [ Initialization, Build ]
    if: (!cancelled()) && needs.Build.result == 'success'
    runs-on: [ windows-latest ]
    name: Create release ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the Apps artifacts were built and only the chosen apps (plus their repository dependencies) were built.
      # '*-Apps-*' matches the compiled-app artifacts but not TestApps or Dependencies.
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1
        with:
          pattern: '*-Apps-*'
          merge-multiple: true
          path: '.artifacts'

      # Picks the .app files of the chosen apps out of the downloaded build (matched by app ID, so apps built only
      # as dependencies are not released) and checks the release tag before anything is created.
      - name: Collect release assets
        id: CollectAssets
        env:
          SelectedAppsJson: ${{ needs.Initialization.outputs.selectedAppsJson }}
          TagName: ${{ github.event.inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0
          Add-Type -AssemblyName System.IO.Compression

          $tag = $env:TagName
          if ($tag -notmatch '^v?\d+\.\d+(\.\d+)?(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
              throw "Tag '$tag' is not a valid semantic version (https://semver.org). Use something like 1.0.0"
          }

          function Get-AppFromAppFile([string] $Path) {
              # A .app file is a short NAVX header followed by a zip archive (same as .github/SelectAppsForDeployment.ps1).
              $bytes = [System.IO.File]::ReadAllBytes($Path)
              $zipStart = -1
              for ($i = 0; $i -lt [Math]::Min(1024, $bytes.Length - 3); $i++) {
                  if ($bytes[$i] -eq 0x50 -and $bytes[$i + 1] -eq 0x4B -and $bytes[$i + 2] -eq 0x03 -and $bytes[$i + 3] -eq 0x04) {
                      $zipStart = $i
                      break
                  }
              }
              if ($zipStart -lt 0) {
                  throw "$Path is not a valid Business Central app file."
              }
              $stream = [System.IO.MemoryStream]::new($bytes, $zipStart, $bytes.Length - $zipStart)
              $zip = [System.IO.Compression.ZipArchive]::new($stream)
              try {
                  $entry = $zip.GetEntry('NavxManifest.xml')
                  if (-not $entry) {
                      throw "$Path has no NavxManifest.xml."
                  }
                  $reader = [System.IO.StreamReader]::new($entry.Open())
                  try {
                      [xml] $manifest = $reader.ReadToEnd()
                  }
                  finally {
                      $reader.Dispose()
                  }
              }
              finally {
                  $zip.Dispose()
              }
              [PSCustomObject]@{
                  Id      = ([string] $manifest.Package.App.Id).ToLowerInvariant()
                  Name    = [string] $manifest.Package.App.Name
                  Version = [string] $manifest.Package.App.Version
                  File    = Split-Path $Path -Leaf
                  Path    = $Path
              }
          }

          # IDs of the apps chosen in the run, read from their app.json.
          $selectedIds = @{}
          $selectedFolders = $env:SelectedAppsJson | ConvertFrom-Json
          foreach ($folder in @($selectedFolders)) {
              $appJson = Get-Content -Path (Join-Path $env:GITHUB_WORKSPACE (Join-Path $folder 'app.json')) -Raw -Encoding UTF8 | ConvertFrom-Json
              $selectedIds[([string] $appJson.id).ToLowerInvariant()] = $folder
          }

          $builtApps = @(Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE '.artifacts') -Recurse -Filter '*.app' | ForEach-Object { Get-AppFromAppFile -Path $_.FullName })
          if ($builtApps.Count -eq 0) {
              throw "The build produced no apps to release."
          }
          $releaseApps = @($builtApps | Where-Object { $selectedIds.ContainsKey($_.Id) } | Sort-Object File -Unique)
          if ($releaseApps.Count -eq 0) {
              $inBuild = ($builtApps | ForEach-Object { "$($_.Name) $($_.Version)" }) -join ', '
              throw "None of the built apps are among the selected apps. The build contains: $inBuild"
          }
          $releasedFolders = @($releaseApps | ForEach-Object { $selectedIds[$_.Id] })
          $missingFolders = @($selectedIds.Values | Where-Object { $_ -notin $releasedFolders })
          if ($missingFolders.Count -gt 0) {
              throw "Selected apps missing from the build: $($missingFolders -join ', '). Check the build log."
          }

          $assets = @($releaseApps | ForEach-Object {
                  [PSCustomObject]@{
                      path      = $_.Path
                      assetName = $_.File
                      name      = $_.Name
                      version   = $_.Version
                  }
              })
          $assetsJson = ConvertTo-Json -InputObject $assets -Compress
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "assetsJson=$assetsJson"
          Write-Host "Release assets:"
          $assets | ForEach-Object { Write-Host "- $($_.assetName)" }

      # A single archive of the chosen apps, convenient for downloading the release and installing the apps manually
      # (the individual .app files are also attached to the release).
      - name: Zip release apps
        id: ZipApps
        env:
          AssetsJson: ${{ steps.CollectAssets.outputs.assetsJson }}
          TagName: ${{ github.event.inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0
          $assets = $env:AssetsJson | ConvertFrom-Json
          $staging = Join-Path $env:RUNNER_TEMP 'releaseapps'
          if (Test-Path $staging) {
              Remove-Item $staging -Recurse -Force
          }
          New-Item $staging -ItemType Directory | Out-Null
          foreach ($asset in $assets) {
              Copy-Item -Path $asset.path -Destination $staging
          }
          $zipName = "$($env:TagName)-Apps.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zipPath
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "zipPath=$zipPath"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "zipName=$zipName"
          Write-Host "Created $zipPath"

      - name: Create release and upload apps
        id: CreateRelease
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AssetsJson: ${{ steps.CollectAssets.outputs.assetsJson }}
          ZipPath: ${{ steps.ZipApps.outputs.zipPath }}
          ZipName: ${{ steps.ZipApps.outputs.zipName }}
          ReleaseName: ${{ github.event.inputs.name }}
          TagName: ${{ github.event.inputs.tag }}
          ReleaseType: ${{ github.event.inputs.releaseType }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const assets = JSON.parse(process.env.AssetsJson || '[]');
            const sorted = assets.slice().sort((a, b) => a.name.localeCompare(b.name));

            const lines = ['## Apps in this release', ''];
            for (const asset of sorted) {
              lines.push(`- ${asset.name} \`${asset.version}\``);
            }
            lines.push('');
            if (process.env.ZipPath && fs.existsSync(process.env.ZipPath)) {
              lines.push(`Download \`${process.env.ZipName}\` for a single archive of the apps above.`);
            }
            else {
              lines.push('Download the .app files attached below.');
            }
            lines.push('', `Built from commit ${context.sha} on the \`${context.ref.replace('refs/heads/', '')}\` branch.`);
            const body = lines.join('\n');

            const createReleaseResponse = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TagName,
              name: process.env.ReleaseName || process.env.TagName,
              body,
              draft: process.env.ReleaseType == 'Draft',
              prerelease: process.env.ReleaseType == 'Prerelease',
              make_latest: 'legacy',
              target_commitish: context.sha
            });
            const releaseId = createReleaseResponse.data.id;
            core.setOutput('releaseId', releaseId);
            core.setOutput('releaseUrl', createReleaseResponse.data.html_url);

            const uploads = assets.map((asset) => ({ path: asset.path, name: asset.assetName }));
            if (process.env.ZipPath && fs.existsSync(process.env.ZipPath)) {
              uploads.push({ path: process.env.ZipPath, name: process.env.ZipName });
            }

            async function uploadWithRetry(upload) {
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  await github.rest.repos.uploadReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: releaseId,
                    name: upload.name,
                    data: fs.readFileSync(upload.path)
                  });
                  return;
                } catch (error) {
                  if (attempt == 3) {
                    throw error;
                  }
                  core.warning(`Upload of ${upload.name} failed (attempt ${attempt}), retrying...`);
                  await new Promise((resolve) => setTimeout(resolve, 2000));
                }
              }
            }

            for (const upload of uploads) {
              await uploadWithRetry(upload);
            }

  PostProcess:
    needs: [ Initialization, Build, CreateRelease ]
    if: (!cancelled())
    runs-on: [ windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Finalize the workflow
        id: PostProcess
        uses: microsoft/AL-Go-Actions/WorkflowPostProcess@v9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          shell: powershell
          telemetryScopeJson: ${{ needs.Initialization.outputs.telemetryScopeJson }}
          currentJobContext: ${{ toJson(job) }}
