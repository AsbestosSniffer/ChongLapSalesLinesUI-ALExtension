# Custom workflow (not part of AL-Go for GitHub, so Update AL-Go System Files leaves it alone).
# Builds the branch the same way CI/CD does - by calling AL-Go's own _BuildALGoProject.yaml - and then deploys only
# the apps chosen in the run, to the environment chosen in the run. Choose the environment "none (build only)" to
# build without deploying anything; the build can be deployed later with the "Deploy Selected Apps" workflow.
# CI/CD is untouched and keeps building and deploying everything.
#
# Every app is built (building one app is barely faster than building all of them, as most of the time goes on
# downloading Business Central and creating the container); only deployment is selective.
#
# When AL-Go is updated, compare the Initialization and Build jobs below with the new CICD.yaml and bring over any
# changes to the AL-Go action versions and to the inputs of _BuildALGoProject.yaml.
name: ' Build And Deploy Selected Apps'

on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: Environment to deploy the build to
        type: choice
        required: true
        default: 'none (build only)'
        options:
          - 'none (build only)'
          - ProdCopy-v5
          - ProdCopy-v4
          - ProdCopy-v6
          - '*'
      # One checkbox per app folder. Tick none (and leave otherApps empty) to deploy every app.
      # When you add an app to the repository, add a checkbox for it here, named app_<folder name>.
      app_app1:
        description: 'app1 (SalesLinesUIExtension)'
        type: boolean
        default: false
      app_FEFOLotAssignment:
        description: 'FEFOLotAssignment'
        type: boolean
        default: false
      app_HAOrderFromEmail:
        description: 'HAOrderFromEmail'
        type: boolean
        default: false
      app_LowAmountOrderNotification:
        description: 'LowAmountOrderNotification'
        type: boolean
        default: false
      app_MixAndMatch:
        description: 'MixAndMatch'
        type: boolean
        default: false
      app_PoisonFormCheckBox:
        description: 'PoisonFormCheckBox'
        type: boolean
        default: false
      app_ReportBuilding:
        description: 'ReportBuilding'
        type: boolean
        default: false
      app_ShopifyUOMCorrection:
        description: 'ShopifyUOMCorrection'
        type: boolean
        default: false
      otherApps:
        description: 'Any app not listed above: folder names, comma-separated'
        type: string
        required: false
        default: ''

permissions:
  actions: read
  contents: read
  id-token: write
  pages: read
  security-events: write
  packages: read

env:
  workflowDepth: 1
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  Initialization:
    needs: [ ]
    runs-on: [ windows-latest ]
    outputs:
      telemetryScopeJson: ${{ steps.init.outputs.telemetryScopeJson }}
      githubRunner: ${{ steps.ReadSettings.outputs.GitHubRunnerJson }}
      githubRunnerShell: ${{ steps.ReadSettings.outputs.GitHubRunnerShell }}
      projects: ${{ steps.determineProjectsToBuild.outputs.ProjectsJson }}
      skippedProjects: ${{ steps.determineProjectsToBuild.outputs.SkippedProjectsJson }}
      projectDependenciesJson: ${{ steps.determineProjectsToBuild.outputs.ProjectDependenciesJson }}
      buildOrderJson: ${{ steps.determineProjectsToBuild.outputs.BuildOrderJson }}
      baselineWorkflowRunId: ${{ steps.determineProjectsToBuild.outputs.BaselineWorkflowRunId }}
      baselineWorkflowSHA: ${{ steps.determineProjectsToBuild.outputs.BaselineWorkflowSHA }}
      environmentsMatrixJson: ${{ steps.DetermineDeploymentEnvironments.outputs.EnvironmentsMatrixJson }}
      environmentCount: ${{ steps.DetermineDeploymentEnvironments.outputs.EnvironmentCount }}
      deploymentEnvironmentsJson: ${{ steps.DetermineDeploymentEnvironments.outputs.DeploymentEnvironmentsJson }}
    steps:
      - name: Dump Workflow Information
        uses: microsoft/AL-Go-Actions/DumpWorkflowInfo@v9.2
        with:
          shell: powershell

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Initialize the workflow
        id: init
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v9.2
        with:
          shell: powershell

      - name: Read settings
        id: ReadSettings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.2
        with:
          shell: powershell
          get: type

      # Checked here so a mistyped app name fails in seconds instead of after the build.
      - name: Validate selected apps
        env:
          SelectedApps: ${{ github.event.inputs.otherApps }}
          InputsJson: ${{ toJson(github.event.inputs) }}
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE '.github/SelectAppsForDeployment.ps1') -ValidateOnly

      - name: Determine Workflow Depth
        id: DetermineWorkflowDepth
        run: |
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "WorkflowDepth=$($env:workflowDepth)"

      - name: Determine Projects To Build
        id: determineProjectsToBuild
        uses: microsoft/AL-Go-Actions/DetermineProjectsToBuild@v9.2
        with:
          shell: powershell
          maxBuildDepth: ${{ env.workflowDepth }}

      # Skipped for build-only runs: the action throws if asked for an environment that doesn't exist.
      - name: Determine Deployment Environments
        id: DetermineDeploymentEnvironments
        if: github.event.inputs.environmentName != 'none (build only)'
        uses: microsoft/AL-Go-Actions/DetermineDeploymentEnvironments@v9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          shell: powershell
          getEnvironments: ${{ github.event.inputs.environmentName }}
          type: 'Publish'
          createEnvIfNotExists: false

  Build:
    needs: [ Initialization ]
    if: (!failure()) && (!cancelled()) && fromJson(needs.Initialization.outputs.buildOrderJson)[0].projectsCount > 0
    strategy:
      matrix:
        include: ${{ fromJson(needs.Initialization.outputs.buildOrderJson)[0].buildDimensions }}
      fail-fast: false
    name: Build ${{ matrix.projectName }} (${{ matrix.buildMode }})
    uses: ./.github/workflows/_BuildALGoProject.yaml
    secrets: inherit
    with:
      shell: ${{ matrix.githubRunnerShell }}
      runsOn: ${{ matrix.githubRunner }}
      project: ${{ matrix.project }}
      projectName: ${{ matrix.projectName }}
      buildMode: ${{ matrix.buildMode }}
      skippedProjectsJson: ${{ needs.Initialization.outputs.skippedProjects }}
      projectDependenciesJson: ${{ needs.Initialization.outputs.projectDependenciesJson }}
      baselineWorkflowRunId: ${{ needs.Initialization.outputs.baselineWorkflowRunId }}
      baselineWorkflowSHA: ${{ needs.Initialization.outputs.baselineWorkflowSHA }}
      secrets: 'licenseFileUrl,codeSignCertificateUrl,*codeSignCertificatePassword,keyVaultCertificateUrl,*keyVaultCertificatePassword,keyVaultClientId,gitHubPackagesContext,applicationInsightsConnectionString'
      signArtifacts: true
      useArtifactCache: true
      needsContext: ${{ toJson(needs) }}

  Deploy:
    needs: [ Initialization, Build ]
    if: (!cancelled()) && needs.Build.result == 'success' && needs.Initialization.outputs.environmentCount > 0
    # The fallback keeps the expression valid on build-only runs, where the environments step is skipped.
    strategy: ${{ fromJson(needs.Initialization.outputs.environmentsMatrixJson || '{"matrix":{"include":[]},"fail-fast":false}') }}
    runs-on: ${{ fromJson(matrix.os) }}
    name: Deploy to ${{ matrix.environment }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    environment:
      name: ${{ matrix.environment }}
      url: ${{ steps.Deploy.outputs.environmentUrl }}
    env:
      ALGoEnvSettings: ${{ vars.ALGoEnvironmentSettings }}
      ALGoEnvName: ${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1
        with:
          path: '.artifacts'

      - name: EnvName
        id: envName
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0
          $envName = '${{ matrix.environment }}'.split(' ')[0]
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "envName=$envName"

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.2
        with:
          shell: ${{ matrix.shell }}
          get: type

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v9.2
        with:
          shell: ${{ matrix.shell }}
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: '${{ steps.envName.outputs.envName }}-AuthContext,${{ steps.envName.outputs.envName }}_AuthContext,AuthContext'

      # The inputs are passed through env, not pasted into the script, so text typed into the run form can't change the script.
      - name: Select apps to deploy
        id: SelectApps
        env:
          SelectedApps: ${{ github.event.inputs.otherApps }}
          InputsJson: ${{ toJson(github.event.inputs) }}
          EnvironmentName: ${{ matrix.environment }}
          DeploymentEnvironmentsJson: ${{ needs.Initialization.outputs.deploymentEnvironmentsJson }}
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE '.github/SelectAppsForDeployment.ps1') | Out-Null

      - name: Deploy to Business Central
        id: Deploy
        uses: microsoft/AL-Go-Actions/Deploy@v9.2
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
        with:
          shell: ${{ matrix.shell }}
          environmentName: ${{ matrix.environment }}
          artifactsFolder: '.artifacts'
          type: 'Publish'
          deploymentEnvironmentsJson: ${{ steps.SelectApps.outputs.deploymentEnvironmentsJson }}

  PostProcess:
    needs: [ Initialization, Build, Deploy ]
    if: (!cancelled())
    runs-on: [ windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Finalize the workflow
        id: PostProcess
        uses: microsoft/AL-Go-Actions/WorkflowPostProcess@v9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          shell: powershell
          telemetryScopeJson: ${{ needs.Initialization.outputs.telemetryScopeJson }}
          currentJobContext: ${{ toJson(job) }}
